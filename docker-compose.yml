version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lms_db
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: lms_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    environment:
      - DB_ENGINE=postgresql
      - POSTGRES_DB=lms_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    depends_on:
      - db

volumes:
  postgres_data: